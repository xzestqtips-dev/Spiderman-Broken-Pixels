name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download game source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;25.1.8937393"

      - name: Download SDL2
        run: |
          git clone \
            --depth 1 \
            --branch release-2.30.x \
            https://github.com/libsdl-org/SDL.git \
            sdl

      - name: Prepare Android project
        run: |
          set -e

          echo "Checking game source files..."

          test -f src/main.cpp
          test -f src/progression.h

          echo "Copying game source files..."

          cp src/main.cpp \
            sdl/android-project/app/jni/src/main.cpp

          cp src/progression.h \
            sdl/android-project/app/jni/src/progression.h

          echo "Connecting SDL2..."

          cd sdl/android-project/app/jni

          ln -sfn "$GITHUB_WORKSPACE/sdl" SDL

          echo "Updating Android build configuration..."

          cat > src/Android.mk <<'EOF'
          LOCAL_PATH := $(call my-dir)

          include $(CLEAR_VARS)

          LOCAL_MODULE := main
          LOCAL_SRC_FILES := main.cpp
          LOCAL_CPPFLAGS += -std=c++17
          LOCAL_SHARED_LIBRARIES := SDL2

          include $(BUILD_SHARED_LIBRARY)
          EOF

          echo "Checking SDL2 files..."

          test -f SDL/Android.mk
          test -f src/main.cpp
          test -f src/progression.h

          echo "Game source files:"
          ls -l src/

      - name: Build Android APK
        working-directory: sdl/android-project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Find and prepare APK
        run: |
          set -e

          APK="sdl/android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            find sdl/android-project/app/build/outputs -type f || true
            exit 1
          fi

          cp "$APK" stickman-pixel-city.apk

          echo "APK created successfully."
          ls -lh stickman-pixel-city.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stickman-pixel-city-apk
          path: stickman-pixel-city.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: stickman-pixel-city.apk
