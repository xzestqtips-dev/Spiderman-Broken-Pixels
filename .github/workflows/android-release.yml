name: Android APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Find and extract game project
        run: |
          mkdir -p extracted

          ZIP=$(find . -type f -name "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            unzip -oq "$ZIP" -d extracted
          else
            echo "No ZIP found. Using repository files."
            find . -maxdepth 3 -type f \
              -not -path "./.git/*" | head -n 100
            cp -r . extracted/project
          fi

          MAIN_CPP=$(find extracted -type f \
            -name "main.cpp" | head -n 1)

          if [ -z "$MAIN_CPP" ]; then
            echo "ERROR: main.cpp was not found."
            find extracted -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$MAIN_CPP")

          echo "MAIN_CPP=$MAIN_CPP" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found: $MAIN_CPP"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Download SDL2
        run: |
          git clone --depth 1 \
            --branch release-2.30.x \
            https://github.com/libsdl-org/SDL.git sdl

      - name: Inspect project
        run: |
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | head -n 200

      - name: Prepare Android project
        run: |
          cp "$MAIN_CPP" \
            sdl/android-project/app/jni/src/main.cpp

          if [ -d "$PROJECT_DIR/assets" ]; then
            mkdir -p sdl/android-project/app/src/main/assets
            cp -r "$PROJECT_DIR/assets/." \
              sdl/android-project/app/src/main/assets/
          fi

      - name: Build APK
        working-directory: sdl/android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        run: |
          APK=$(find sdl/android-project/app/build/outputs/apk \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" StickmanPixelCity.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StickmanPixelCity-APK
          path: StickmanPixelCity.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Stickman Pixel City ${{ github.ref_name }}
          generate_release_notes: true
          files: StickmanPixelCity.apk
