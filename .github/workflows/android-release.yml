name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;25.1.8937393"

      - name: Find or extract game source
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/game-source"

          if [ -f "src/main.cpp" ] && [ -f "src/progression.h" ]; then
            echo "Game source found in the repository."
            echo "$GITHUB_WORKSPACE" > source-path.txt

          else
            echo "Game source not found at the repository root."
            echo "Searching for a ZIP archive..."

            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name '*.zip' \
              ! -path '*/game-source/*' \
              -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No game source files or ZIP archive found."
              echo "Commit the game source or its ZIP file to GitHub."
              find "$GITHUB_WORKSPACE" \
                -maxdepth 3 \
                -type f | head -100
              exit 1
            fi

            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d game-source

            MAIN_FILE=$(find game-source \
              -type f -path '*/src/main.cpp' \
              -print -quit)

            if [ -z "$MAIN_FILE" ]; then
              echo "ERROR: src/main.cpp was not found inside the ZIP."
              find game-source -maxdepth 5 -type f
              exit 1
            fi

            PROJECT_DIR=$(dirname "$(dirname "$MAIN_FILE")")

            if [ ! -f "$PROJECT_DIR/src/progression.h" ]; then
              echo "ERROR: src/progression.h is missing."
              exit 1
            fi

            echo "$GITHUB_WORKSPACE/$PROJECT_DIR" > source-path.txt
          fi

          echo "Detected source directory:"
          cat source-path.txt

      - name: Download SDL2
        run: |
          git clone \
            --depth 1 \
            --branch release-2.30.x \
            https://github.com/libsdl-org/SDL.git \
            sdl

      - name: Prepare Android project
        run: |
          set -e

          PROJECT_DIR=$(cat source-path.txt)

          test -f "$PROJECT_DIR/src/main.cpp"
          test -f "$PROJECT_DIR/src/progression.h"

          JNI_DIR="$GITHUB_WORKSPACE/sdl/android-project/app/jni"

          cp "$PROJECT_DIR/src/main.cpp" \
            "$JNI_DIR/src/main.cpp"

          cp "$PROJECT_DIR/src/progression.h" \
            "$JNI_DIR/src/progression.h"

          ln -sfn "$GITHUB_WORKSPACE/sdl" "$JNI_DIR/SDL"

          cat > "$JNI_DIR/src/Android.mk" <<'EOF'
          LOCAL_PATH := $(call my-dir)

          include $(CLEAR_VARS)

          LOCAL_MODULE := main
          LOCAL_SRC_FILES := main.cpp
          LOCAL_CPPFLAGS += -std=c++17
          LOCAL_SHARED_LIBRARIES := SDL2

          include $(BUILD_SHARED_LIBRARY)
          EOF

          echo "Checking Android build files..."
          test -f "$JNI_DIR/SDL/Android.mk"
          test -f "$JNI_DIR/src/main.cpp"
          test -f "$JNI_DIR/src/progression.h"

          echo "Game source files are ready."

      - name: Build debug APK
        working-directory: sdl/android-project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          set -e

          APK="sdl/android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find sdl/android-project/app/build/outputs \
              -type f 2>/dev/null || true
            exit 1
          fi

          cp "$APK" stickman-pixel-city.apk
          ls -lh stickman-pixel-city.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stickman-pixel-city-apk
          path: stickman-pixel-city.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: stickman-pixel-city.apk
