name: Build APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find APK or ZIP
        id: files
        shell: bash
        run: |
          APK=$(find . -maxdepth 5 -type f -iname "*.apk" | head -n 1)
          ZIP=$(find . -maxdepth 5 -type f -iname "*.zip" | head -n 1)

          if [ -n "$APK" ]; then
            echo "file=$APK" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          elif [ -n "$ZIP" ]; then
            echo "file=$ZIP" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"
          else
            echo "No APK or ZIP file found!"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('release-{0}', github.run_number) }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || format('#{0}', github.run_number) }}
          generate_release_notes: true
          files: ${{ steps.files.outputs.file }}
          fail_on_unmatched_files: true

