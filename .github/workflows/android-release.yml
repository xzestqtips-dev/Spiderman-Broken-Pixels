name: Android APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find game source
        run: |
          mkdir -p extracted

          ZIP=$(find . -type f -name "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -n "$ZIP" ]; then
            unzip -oq "$ZIP" -d extracted
          else
            mkdir -p extracted/project
            find . -maxdepth 1 -mindepth 1 \
              ! -name ".git" \
              ! -name "extracted" \
              -exec cp -r {} extracted/project/ \;
          fi

          MAIN_CPP=$(find extracted -type f \
            -name "main.cpp" | head -n 1)

          if [ -z "$MAIN_CPP" ]; then
            echo "ERROR: main.cpp was not found."
            find extracted -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          echo "MAIN_CPP=$MAIN_CPP" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$MAIN_CPP")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;25.1.8937393"

      - name: Download SDL2
        run: |
          git clone --depth 1 \
            --branch release-2.30.x \
            https://github.com/libsdl-org/SDL.git sdl

      - name: Prepare Android project
        run: |
          cp "$MAIN_CPP" \
            sdl/android-project/app/jni/src/main.cpp

          if [ -d "$PROJECT_DIR/assets" ]; then
            mkdir -p sdl/android-project/app/src/main/assets
            cp -r "$PROJECT_DIR/assets/." \
              sdl/android-project/app/src/main/assets/
          fi

          echo "Checking SDL2 module files..."
          find sdl -name Android.mk -o -name Application.mk

          if [ ! -f sdl/android-project/app/jni/SDL/Android.mk ]; then
            echo "SDL2 Android.mk is missing from the expected location."
            echo "Checking the SDL Android project structure:"
            find sdl/android-project -maxdepth 5 -type f | head -n 200
            exit 1
          fi

      - name: Build APK
        working-directory: sdl/android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        run: |
          APK=$(find sdl/android-project/app/build/outputs/apk \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" StickmanPixelCity.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StickmanPixelCity-APK
          path: StickmanPixelCity.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Stickman Pixel City ${{ github.ref_name }}
          generate_release_notes: true
          files: StickmanPixelCity.apk
