name: Release APK

on:
  push:
    tags: ['v*']          # e.g. git tag v1.0.0 && git push --tags
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

env:
  APP_NAME: NYC-Pixel-Runner
  APP_ID: com.nycpixelrunner.game
  SDL_BRANCH: release-2.30.x

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Get SDL2 Android project
        run: git clone --depth 1 --branch "$SDL_BRANCH" https://github.com/libsdl-org/SDL.git sdl

      - name: Drop the game into the SDL project
        run: |
          P=sdl/android-project/app
          # sources
          cp src/main.cpp src/*.h $P/jni/src/
          sed -i 's/^LOCAL_SRC_FILES.*/LOCAL_SRC_FILES := main.cpp/' $P/jni/src/Android.mk
          echo 'LOCAL_CPPFLAGS += -std=c++17' >> $P/jni/src/Android.mk
          # assets (game loads "assets/...")
          mkdir -p $P/src/main/assets/assets
          cp -r assets/. $P/src/main/assets/assets/
          # app id, name, landscape, version
          sed -i "s/org.libsdl.app/${APP_ID}/g" $P/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/; s/versionCode .*/versionCode ${GITHUB_RUN_NUMBER}/" $P/build.gradle
          sed -i 's/android:screenOrientation="[^"]*"//; s/<activity /<activity android:screenOrientation="sensorLandscape" /' $P/src/main/AndroidManifest.xml
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">NYC Pixel Runner</string>|" $P/src/main/res/values/strings.xml || true

      - name: Build release APK
        working-directory: sdl/android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
          else
            echo "::warning::No KEYSTORE_B64 secret set - signing with a temporary key (not suitable for Play Store / updates)."
            KEYSTORE_PASS=android; KEY_ALIAS=temp
            keytool -genkeypair -keystore release.jks -alias temp -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android -dname "CN=NYC Pixel Runner"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls sdl/android-project/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASS" --out "${APP_NAME}-${VERSION}.apk" aligned.apk
          "$BT/apksigner" verify "${APP_NAME}-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: ${{ env.APP_NAME }}-${{ env.VERSION }}.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_NAME }}-${{ env.VERSION }}.apk
          generate_release_notes: true
