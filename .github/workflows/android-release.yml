name: Android APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build SDL2 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" \
            ! -name "project.zip" | head -n 1)

          if [ -n "$ZIP" ]; then
            mkdir -p extracted
            unzip -oq "$ZIP" -d extracted
            ROOT="extracted"
          else
            ROOT="."
          fi

          if [ ! -f "$ROOT/src/main.cpp" ]; then
            echo "Could not find src/main.cpp"
            echo "Make sure the ZIP contains the game source files."
            exit 1
          fi

          echo "SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Game source found."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download SDL2 Android project
        run: |
          git clone --depth 1 \
            --branch release-2.30.x \
            https://github.com/libsdl-org/SDL.git sdl

      - name: Prepare game source
        run: |
          cp "$SOURCE_ROOT/src/main.cpp" \
            sdl/android-project/app/jni/src/main.cpp

          cd sdl/android-project/app/jni

          cat > src/Android.mk <<'EOF'
          LOCAL_PATH := $(call my-dir)

          include $(CLEAR_VARS)

          LOCAL_MODULE := main
          SDL_PATH := ../SDL

          LOCAL_SRC_FILES := src/main.cpp
          LOCAL_CPPFLAGS += -std=c++17

          LOCAL_SHARED_LIBRARIES := SDL2

          LOCAL_LDLIBS := -lGLESv1_CM -lGLESv2 -lOpenSLES -llog

          include $(BUILD_SHARED_LIBRARY)
          EOF

          ln -sfn ../../.. SDL

      - name: Build Android APK
        working-directory: sdl/android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          APK=$(find sdl/android-project/app/build/outputs/apk \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          cp "$APK" StickmanPixelCity.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickmanPixelCity-APK
          path: StickmanPixelCity.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Stickman Pixel City ${{ github.ref_name }}
          generate_release_notes: true
          files: StickmanPixelCity.apk
