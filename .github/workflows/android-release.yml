name: Build release APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repo only needs the .zip plus this file. Unzip happens here, on the runner.
      - name: Unzip the game
        run: |
          unzip -q "$(ls *.zip | head -1)" -d game
          GAME=$(dirname "$(find game -name main.cpp | head -1)")
          echo "GAME_SRC=$PWD/$GAME" >> $GITHUB_ENV

      - name: Get SDL2 Android project
        run: git clone --depth 1 --branch release-2.30.x https://github.com/libsdl-org/SDL.git sdl

      - name: Drop the game in
        run: |
          J=sdl/android-project/app/jni
          cp "$GAME_SRC"/* $J/src/ 2>/dev/null || true   # main.cpp + combo.h + progression.h
          sed -i 's/^LOCAL_SRC_FILES.*/LOCAL_SRC_FILES := main.cpp\nLOCAL_CPPFLAGS += -std=c++17/' $J/src/Android.mk
          ln -sfn ../../.. $J/SDL
          M=sdl/android-project/app/src/main/AndroidManifest.xml
          grep -q screenOrientation $M || sed -i '0,/<activity/s//<activity android:screenOrientation="landscape"/' $M

      - name: Build release APK
        working-directory: sdl/android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        run: |
          keytool -genkeypair -keystore release.jks -alias game -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=StickPixel"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls sdl/android-project/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f -p 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias game \
            --ks-pass pass:android --out release.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release.apk
