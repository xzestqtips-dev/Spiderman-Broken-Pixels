name: Release APK

on:
  push:
    tags: ['v*']          # e.g. git tag v1.0.0 && git push --tags
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

env:
  APP_NAME: Spiderman-Broken-Pixels
  APP_ID: com.nycpixelrunner.game
  SDL_BRANCH: release-2.30.x

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"

      - name: Get SDL2 Android project
        run: git clone --depth 1 --branch "$SDL_BRANCH" https://github.com/libsdl-org/SDL.git sdl

      - name: Unzip the game if the repo only has a .zip
        run: |
          if [ -z "$(find . -path ./sdl -prune -o -name main.cpp -print | head -1)" ]; then
            for z in $(find . -maxdepth 2 -name '*.zip' -not -path './sdl/*'); do
              echo "Unzipping $z"; unzip -q -o "$z" -d game_unzipped
            done
          fi

      - name: Drop the game into the SDL project
        run: |
          P=sdl/android-project/app
          # find the game wherever it sits in the repo (root or a subfolder)
          MAIN=$(find . -path ./sdl -prune -o -name main.cpp -print | head -1)
          SHEET=$(find . -path ./sdl -prune -o -name spritesheet.tga -print | head -1)
          [ -n "$MAIN" ] || { echo "::error::main.cpp not found in repo"; find . -path ./sdl -prune -o -type f -print | head -50; exit 1; }
          [ -n "$SHEET" ] || { echo "::error::assets/spritesheet.tga not found in repo"; exit 1; }
          SRC_DIR=$(dirname "$MAIN"); ASSETS_DIR=$(dirname "$SHEET")
          echo "Using sources: $SRC_DIR  assets: $ASSETS_DIR"
          # sources
          cp "$SRC_DIR"/*.cpp "$SRC_DIR"/*.h $P/jni/src/ 2>/dev/null || cp "$MAIN" $P/jni/src/
          sed -i 's/^LOCAL_SRC_FILES.*/LOCAL_SRC_FILES := main.cpp/' $P/jni/src/Android.mk
          echo 'LOCAL_CPPFLAGS += -std=c++17' >> $P/jni/src/Android.mk
          # assets (game loads "assets/...")
          mkdir -p $P/src/main/assets/assets
          cp -r "$ASSETS_DIR"/. $P/src/main/assets/assets/
          # app id, name, landscape, version
          sed -i "s/org.libsdl.app/${APP_ID}/g" $P/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/; s/versionCode .*/versionCode ${VERSION_CODE}/" $P/build.gradle
          sed -i 's/android:screenOrientation="[^"]*"//; s/<activity /<activity android:screenOrientation="sensorLandscape" /' $P/src/main/AndroidManifest.xml
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">Spiderman:Broken Pixels</string>|" $P/src/main/res/values/strings.xml || true

      - name: Build release APK
        working-directory: sdl/android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          # Fixed key built into this file, so every build has the same signature
          # and installs over the previous version. Don't change it.
          KS_PASS: nycrunner123
          KS_ALIAS: nycrunner
          KS_B64: 
        run: |
          echo "$KS_B64" | base64 -d > release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls sdl/android-project/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KS_ALIAS" \
            --ks-pass pass:"$KS_PASS" --out "${APP_NAME}-${VERSION}.apk" aligned.apk
          "$BT/apksigner" verify "${APP_NAME}-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: ${{ env.APP_NAME }}-${{ env.VERSION }}.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_NAME }}-${{ env.VERSION }}.apk
          generate_release_notes: true
